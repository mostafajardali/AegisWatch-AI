name: AegisWatch CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7dnc 

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verifier la syntaxe Python
        run: |
          python -m compileall src dashboard

      - name: Executer les tests Pytest
        run: |
          python -m pytest -v
